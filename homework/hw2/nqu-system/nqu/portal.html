<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校務行政資訊系統二 - 國立金門大學</title>
<style>
/* =====================================================================
   國立金門大學 校務行政資訊系統二
   風格：深綠學術風（銳利直角、細硬線條、金色分隔線）
   ===================================================================== */
:root{
  /* 深綠主色 */
  --grn-950:#07291a; --grn-900:#0b3b25; --grn-800:#0f4c2e; --grn-700:#145c38;
  --grn-600:#1b7044; --grn-500:#2b8a57;
  --grn-100:#d7e8dd; --grn-50:#eef5f0;
  /* 金色學術點綴 */
  --gold:#c2a24a; --gold-dark:#8d7326; --gold-50:#faf5e6;
  /* 中性 */
  --paper:#f2f5f2; --panel:#ffffff;
  --ink-900:#12211a; --ink-700:#2e3c35; --ink-600:#4a5a52; --ink-500:#6b7a72;
  --line:#c3cfc8; --line-soft:#dde5e0;
  /* 狀態 */
  --amber-bg:#fdf6e3; --amber-line:#e3cb86; --amber-tx:#8a6a12;
  --rose-bg:#fbeceb; --rose-line:#e0b3af; --rose-tx:#9b2c22;
  --sidebar-w:288px; --topbar-h:62px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans TC",system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink-700);
  font-size:15px;line-height:1.62;
  -webkit-text-size-adjust:100%;
}
a{color:var(--grn-700);}

/* ---------------- Topbar ---------------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;
  background:linear-gradient(180deg,var(--grn-900) 0%,var(--grn-950) 100%);
  border-bottom:3px solid var(--gold);
  color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;
}
.hamburger{
  display:none;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:0;
  width:36px;height:36px;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto;
}
.hamburger span{display:block;width:17px;height:2px;background:#fff;position:relative;}
.hamburger span::before,.hamburger span::after{content:"";position:absolute;left:0;width:17px;height:2px;background:#fff;}
.hamburger span::before{top:-5px;} .hamburger span::after{top:5px;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand .crest{
  width:34px;height:34px;flex:0 0 auto;border-radius:0;
  background:var(--gold);color:var(--grn-950);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;letter-spacing:.5px;
  font-family:"Times New Roman",serif;
}
.brand .names{min-width:0;line-height:1.25;}
.brand .zh{font-size:16px;font-weight:700;white-space:nowrap;letter-spacing:1px;}
.brand .en{font-size:10px;color:var(--gold);white-space:nowrap;letter-spacing:.6px;text-transform:uppercase;}
.topbar .spacer{flex:1 1 auto;}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px;}
.userbox .who{text-align:right;line-height:1.3;}
.userbox .who b{display:block;font-size:14px;}
.userbox .who small{color:var(--grn-100);font-size:11px;}
.userbox .avatar{
  width:32px;height:32px;border-radius:0;
  background:var(--grn-600);border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
}
.logout{
  background:transparent;border:1px solid rgba(255,255,255,.45);
  color:#fff;border-radius:0;padding:5px 12px;font-size:12.5px;cursor:pointer;
  font-family:inherit;white-space:nowrap;letter-spacing:1px;
}
.logout:hover{background:var(--gold);border-color:var(--gold);color:var(--grn-950);}

/* ---------------- Layout ---------------- */
.shell{display:flex;padding-top:var(--topbar-h);min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--panel);border-right:1px solid var(--line);
  position:fixed;top:var(--topbar-h);bottom:0;left:0;
  overflow-y:auto;z-index:40;transition:transform .2s ease;
}
.main{flex:1 1 auto;margin-left:var(--sidebar-w);padding:22px clamp(14px,3vw,30px) 48px;min-width:0;}
.overlay{display:none;position:fixed;inset:var(--topbar-h) 0 0 0;background:rgba(7,41,26,.55);z-index:39;}
.overlay.show{display:block;}

/* ---------------- Sidebar ---------------- */
.sidebar .side-head{
  padding:12px 16px;border-bottom:2px solid var(--grn-900);
  background:var(--grn-50);
}
.sidebar .side-head h2{margin:0;font-size:12.5px;letter-spacing:4px;color:var(--grn-800);font-weight:700;}
.menu{padding:6px 6px 30px;}
.menu-group{margin-bottom:2px;}
.m-btn{
  width:100%;display:flex;align-items:center;gap:9px;
  background:none;border:0;border-left:3px solid transparent;border-radius:0;
  padding:10px 11px;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink-700);
  text-align:left;letter-spacing:1px;
}
.m-btn:hover{background:var(--grn-50);border-left-color:var(--grn-500);}
.m-btn .ic{
  width:24px;height:24px;flex:0 0 auto;border-radius:0;
  background:var(--grn-800);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.m-btn .caret{margin-left:auto;color:var(--ink-500);font-size:10px;transition:transform .15s ease;}
.m-btn[aria-expanded="true"] .caret{transform:rotate(90deg);}
.m-btn[aria-expanded="true"]{color:var(--grn-900);background:var(--grn-50);border-left-color:var(--grn-800);}

.sub{display:none;padding:2px 0 6px 10px;margin-left:14px;border-left:1px solid var(--line-soft);}
.sub.open{display:block;}

.s-btn{
  width:100%;display:flex;align-items:center;gap:7px;
  background:none;border:0;border-radius:0;padding:7px 9px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:700;color:var(--grn-800);
  text-align:left;letter-spacing:.5px;
}
.s-btn:hover{background:var(--grn-50);}
.s-btn .caret{margin-left:auto;color:var(--ink-500);font-size:9px;transition:transform .15s ease;}
.s-btn[aria-expanded="true"] .caret{transform:rotate(90deg);}

.leaf{
  width:100%;display:block;text-align:left;
  background:none;border:0;border-radius:0;
  padding:6.5px 10px 6.5px 19px;cursor:pointer;
  font-family:inherit;font-size:13.5px;color:var(--ink-600);position:relative;
}
.leaf::before{
  content:"";position:absolute;left:8px;top:50%;margin-top:-2px;
  width:4px;height:4px;background:var(--line);
}
.leaf:hover{background:var(--grn-50);color:var(--grn-900);}
.leaf:hover::before{background:var(--grn-600);}
.leaf.active{background:var(--grn-800);color:#fff;font-weight:700;}
.leaf.active::before{background:var(--gold);}

/* ---------------- Page head ---------------- */
.page-head{margin:0 0 18px;border-bottom:2px solid var(--grn-900);padding-bottom:9px;}
.page-head h1{
  margin:0 0 4px;font-size:clamp(20px,3.4vw,26px);font-weight:700;
  color:var(--grn-950);letter-spacing:3px;
}
.page-head .crumb{font-size:12.5px;color:var(--ink-500);letter-spacing:.5px;}
.page-head .crumb span{color:var(--gold-dark);margin:0 5px;}

/* ---------------- Cards ---------------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:0;
  margin-bottom:18px;overflow:hidden;
  box-shadow:1px 1px 0 rgba(11,59,37,.07);
}
.card-head{
  padding:11px 16px;background:var(--grn-900);
  border-bottom:2px solid var(--gold);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.card-head h3{
  margin:0;font-size:16px;font-weight:700;color:#fff;
  line-height:1.5;flex:1 1 300px;letter-spacing:1px;
}
.card-head .tag{background:transparent;color:var(--gold);border:1px solid var(--gold);}
.card-body{padding:16px 18px;}
.card-body p{margin:0 0 10px;color:var(--ink-700);}
.card-body p:last-child{margin-bottom:0;}
.card-body b{color:var(--grn-900);}

.tag{
  display:inline-block;font-size:11.5px;font-weight:700;border-radius:0;
  padding:2px 9px;white-space:nowrap;letter-spacing:1px;
}
.tag.blue,.tag.green{background:var(--grn-50);color:var(--grn-800);border:1px solid var(--grn-100);}
.tag.amber{background:var(--amber-bg);color:var(--amber-tx);border:1px solid var(--amber-line);}
.tag.rose{background:var(--rose-bg);color:var(--rose-tx);border:1px solid var(--rose-line);}
.tag.slate{background:#eef1ee;color:var(--ink-600);border:1px solid var(--line);}

.callout{
  border:1px solid var(--grn-100);border-left:4px solid var(--grn-700);
  background:var(--grn-50);border-radius:0;
  padding:11px 14px;font-size:14px;color:var(--ink-700);margin:12px 0;
}
.callout.amber{border-color:var(--amber-line);border-left-color:var(--gold-dark);background:var(--amber-bg);}
.callout.rose{border-color:var(--rose-line);border-left-color:var(--rose-tx);background:var(--rose-bg);}
.callout b{color:var(--grn-950);}
.path-chip{
  display:inline-block;background:#fff;border:1px solid var(--grn-700);
  border-radius:0;padding:2px 9px;font-size:13px;color:var(--grn-800);font-weight:700;
}

/* ---------------- Tables ---------------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--grn-900);}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
table.t th{
  background:var(--grn-900);color:#fff;font-weight:700;text-align:center;
  padding:9px 10px;border:1px solid var(--grn-700);white-space:nowrap;letter-spacing:1px;
}
table.t td{
  border:1px solid var(--line);padding:8px 10px;color:var(--ink-700);
  text-align:center;vertical-align:middle;
}
table.t td.l{text-align:left;}
table.t tbody tr:nth-child(even){background:#f6f9f7;}
table.t tbody tr:hover{background:var(--grn-50);}
table.t tfoot td{background:var(--grn-50);font-weight:700;color:var(--grn-900);border-color:var(--grn-100);}

/* 文件式表頭（襯線＝學術感） */
.doc-head{
  text-align:center;padding:18px 10px 10px;
  border-bottom:3px double var(--grn-800);
  font-family:"Noto Serif CJK TC","Songti TC","PMingLiU",serif;
}
.doc-head .univ{font-size:17px;font-weight:700;color:var(--grn-950);letter-spacing:6px;}
.doc-head .kind{font-size:20px;font-weight:700;color:var(--grn-900);letter-spacing:7px;margin-top:3px;}
.doc-head .term{font-size:14.5px;color:var(--ink-600);margin-top:3px;letter-spacing:3px;}
.doc-meta{
  display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;
  padding:10px 18px;font-size:13px;color:var(--ink-600);
  border-bottom:1px solid var(--line-soft);
}
.doc-meta .rose{color:var(--rose-tx);font-weight:700;}
.doc-foot{
  display:flex;flex-wrap:wrap;gap:8px 28px;
  padding:11px 18px;font-size:13.5px;color:var(--ink-700);
  background:var(--grn-50);border-top:2px solid var(--grn-800);
}
.doc-foot b{color:var(--grn-950);}

/* ---------------- Controls ---------------- */
.form-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.form-row label{font-size:14px;font-weight:700;color:var(--grn-900);letter-spacing:1px;}
select.ctl,input.ctl{
  font-family:inherit;font-size:14px;color:var(--ink-900);
  padding:7px 11px;border:1px solid var(--grn-700);border-radius:0;background:#fff;
  min-width:170px;
}
select.ctl:focus,input.ctl:focus{outline:2px solid var(--gold);outline-offset:0;}
.btn2{
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px;
  padding:7px 20px;border-radius:0;border:1px solid var(--grn-950);
  background:var(--grn-800);color:#fff;white-space:nowrap;
}
.btn2:hover{background:var(--grn-950);}
.btn2.ghost{background:#fff;color:var(--grn-900);border-color:var(--grn-700);}
.btn2.ghost:hover{background:var(--grn-50);}

/* ---------------- States ---------------- */
.state{text-align:center;padding:48px 20px;}
.state .ico{
  width:62px;height:62px;margin:0 auto 14px;border-radius:0;
  display:flex;align-items:center;justify-content:center;font-size:27px;
}
.state.closed .ico{background:var(--rose-bg);color:var(--rose-tx);border:2px solid var(--rose-line);}
.state.empty .ico{background:var(--grn-50);color:var(--grn-800);border:2px solid var(--grn-100);}
.state.build .ico{background:var(--amber-bg);color:var(--amber-tx);border:2px solid var(--amber-line);}
.state h3{margin:0 0 8px;font-size:19px;color:var(--grn-950);letter-spacing:3px;}
.state p{margin:0;color:var(--ink-500);font-size:14px;}

.note-small{font-size:12.5px;color:var(--ink-500);margin-top:10px;line-height:1.8;}
.note-small ol{margin:4px 0 0;padding-left:1.4em;}
.note-small b{color:var(--grn-900);}

/* ---------------- RWD ---------------- */
@media (max-width:900px){
  .hamburger{display:flex;}
  .sidebar{transform:translateX(-100%);border-right:3px solid var(--gold);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .brand{flex:1 1 auto;min-width:0;}
  .brand .names{overflow:hidden;}
  .brand .zh{font-size:15px;overflow:hidden;text-overflow:ellipsis;}
  .brand .en{display:none;}
  .userbox .who{display:none;}
}
@media (max-width:520px){
  body{font-size:14.5px;}
  .topbar{gap:9px;padding:0 11px;}
  .brand .crest{display:none;}
  .brand .zh{font-size:14px;letter-spacing:0;}
  .page-head h1{letter-spacing:1.5px;}
  .card-head,.card-body{padding-left:13px;padding-right:13px;}
  .doc-meta,.doc-foot{padding-left:13px;padding-right:13px;}
  .doc-head .univ{letter-spacing:3px;}
  .doc-head .kind{font-size:17px;letter-spacing:3px;}
  select.ctl,input.ctl{min-width:0;width:100%;}
  .form-row{gap:8px;}
  .form-row > *{flex:1 1 100%;}
  .btn2{width:100%;}
}
@media print{
  .topbar,.sidebar,.overlay,.no-print{display:none !important;}
  .main{margin:0;padding:0;}
  body{background:#fff;}
  .card{border:1px solid #000;box-shadow:none;}
  .card-head{background:#fff;border-bottom:2px solid #000;}
  .card-head h3{color:#000;}
  table.t th{background:#e8e8e8;color:#000;border-color:#000;}
}
</style>
</head>

function buildMenu(){
  var host = document.getElementById('menu');
  MENU.forEach(function(g){
    var wrap = document.createElement('div');
    wrap.className = 'menu-group';

    var b = document.createElement('button');
    b.className = 'm-btn';
    b.setAttribute('aria-expanded','false');
    b.innerHTML = '<span class="ic">' + g.icon + '</span><span>' + g.title + '</span><span class="caret">▶</span>';
    wrap.appendChild(b);

    var sub = document.createElement('div');
    sub.className = 'sub';

    if (g.leaves){
      g.leaves.forEach(function(lf){ sub.appendChild(makeLeaf(lf[0], lf[1], g.title)); });
    } else {
      g.groups.forEach(function(sg){
        var sb = document.createElement('button');
        sb.className = 's-btn';
        sb.setAttribute('aria-expanded','false');
        sb.innerHTML = '<span>' + sg.title + '</span><span class="caret">▶</span>';
        var inner = document.createElement('div');
        inner.className = 'sub';
        sg.leaves.forEach(function(lf){ inner.appendChild(makeLeaf(lf[0], lf[1], g.title + ' ／ ' + sg.title)); });
        sb.addEventListener('click', function(){ toggle(sb, inner); });
        sub.appendChild(sb); sub.appendChild(inner);
      });
    }
    b.addEventListener('click', function(){ toggle(b, sub); });
    wrap.appendChild(sub);
    host.appendChild(wrap);
  });
}
function toggle(btn, panel){
  var open = panel.classList.toggle('open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function makeLeaf(label, view, crumb){
  var el = document.createElement('button');
  el.className = 'leaf';
  el.textContent = label;
  el.dataset.view = view;
  el.addEventListener('click', function(){
    document.querySelectorAll('.leaf.active').forEach(function(n){ n.classList.remove('active'); });
    el.classList.add('active');
    render(view, label, crumb);
    closeSidebar();
    window.scrollTo(0,0);
  });
  return el;
}

         '</div>';

function stateBlock(kind, ico, t, p){
  return '<div class="card"><div class="state ' + kind + '"><div class="ico">' + ico + '</div><h3>' + t + '</h3><p>' + p + '</p></div></div>';

function today(){
  var d = new Date();
  function z(n){ return (n<10?'0':'') + n; }
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

function jump(view){
  var t = document.querySelector('.leaf[data-view="' + view + '"]');
  if (t){
    var p = t.parentElement;
    while (p && p !== document.body){
      if (p.classList && p.classList.contains('sub')){
        p.classList.add('open');
        var btn = p.previousElementSibling;
        if (btn && btn.setAttribute) btn.setAttribute('aria-expanded','true');
      }
      p = p.parentElement;
    }
    t.click();
  }
}

function cellPair(r){

function dash(v){ return (v === '' || v === undefined || v === null) ? '－' : v; }
