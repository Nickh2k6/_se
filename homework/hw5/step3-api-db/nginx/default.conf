# Nginx：提供監控網頁，並把 WebSocket 反向代理到 rosbridge
#
# 重點：Nginx 在 bridge 網路裡，rosbridge 在 host 網路上。
# 在 bridge 網路裡，"localhost" 指的是 Nginx 容器自己，不是主機！
# 所以要用 host.docker.internal（在 compose 的 extra_hosts 指向 host-gateway）
# 才能連到主機上的 9090 port。

# WebSocket 升級需要的標頭：有 Upgrade 就送 "upgrade"，沒有就送 "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 靜態網頁
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 瀏覽器連 ws://<主機>:8080/rosbridge/ → 轉給主機的 rosbridge :9090
    # proxy_pass 結尾的 "/" 會把 /rosbridge/ 前綴去掉，
    # 因為 rosbridge 只接受根路徑 "/"
    location /rosbridge/ {
        proxy_pass http://host.docker.internal:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        # 預設 60 秒沒資料就斷線；機器人靜止時 topic 可能很久沒更新
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 第 3 步：/api/ → FastAPI 容器
    #
    # 這裡跟 rosbridge 不一樣：api 和 nginx 在同一個 bridge 網路 (web)，
    # 所以可以直接用 service 名稱 "api"，由 Docker 內建 DNS (127.0.0.11) 解析。
    #
    # 為什麼要寫 resolver + 變數，而不是直接 proxy_pass http://api:8000？
    # → 直接寫的話，nginx 只在啟動時查一次 IP。api 容器重建後 IP 會變，
    #   nginx 還連舊 IP，就會一直 502。用變數會讓 nginx 每次請求都重新查 DNS。
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;          # 用變數時，原始路徑 /api/... 會原封不動轉過去
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 自動產生的 API 文件（Swagger UI），練習時很好用
    location ~ ^/(docs|openapi\.json)$ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
    }

    # 給 healthcheck 用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
