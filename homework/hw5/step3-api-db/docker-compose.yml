# 第 1 步：ROS 2 開發容器 + rosbridge（host 網路）
# 第 2 步：Nginx 監控網頁（bridge 網路）
# 第 3 步：FastAPI + PostgreSQL 巡檢紀錄
#
# 用法：docker compose up -d --build
#       docker compose exec ros_dev bash
#       瀏覽器開 http://localhost:8080
#
# 網路總覽：
#   host 網路     ros_dev、rosbridge          （和主機上的 Gazebo 用 DDS 溝通）
#   web 網路      nginx、api                 （對外只有 nginx 的 8080）
#   backend 網路  api、postgres  [internal]  （資料庫完全不對外）

# ROS service 共用的設定（YAML anchor，可以少寫重複的東西）
x-ros-common: &ros-common
  image: amr/ros2-humble-dev:latest
  # ROS 2 的 DDS 用 multicast 找節點，bridge 網路會擋掉，
  # 所以 ROS 相關容器一律用 host 網路
  network_mode: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  restart: unless-stopped

services:
  # ------------------------------------------------------------ 第 1 步
  # 開發用容器：寫程式、colcon build、跑自己的節點
  ros_dev:
    <<: *ros-common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: ros_dev
    volumes:
      # bind mount：主機改程式，容器內立刻看得到
      - ./src:/ws/src
      - ./maps:/ws/maps
      # named volume：build 產物留在 Docker 管理的空間，
      # 不會跟主機原生 colcon build 的結果互相覆蓋
      - ros_build:/ws/build
      - ros_install:/ws/install
      - ros_log:/ws/log
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  # rosbridge：把 ROS topic 轉成 WebSocket (port 9090)
  rosbridge:
    <<: *ros-common
    container_name: rosbridge
    depends_on:
      - ros_dev   # 確保 image 先被 ros_dev build 出來
    command: ["ros2", "launch", "rosbridge_server", "rosbridge_websocket_launch.xml", "port:=9090"]

  # ------------------------------------------------------------ 第 2 步
  # 監控網頁 + 反向代理，對外唯一的入口
  nginx:
    image: nginx:1.27-alpine
    container_name: amr_nginx
    ports:
      - "8080:80"            # 主機 8080 → 容器 80
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # 讓容器裡的 host.docker.internal 指向主機（Linux 需要手動加這行）
      - "host.docker.internal:host-gateway"
    networks:
      - web
    depends_on:
      rosbridge:
        condition: service_started
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------ 第 3 步
  # 巡檢紀錄 API：從 rosbridge 收樓層變化，寫進 PostgreSQL
  api:
    build: ./api
    image: amr/api:latest
    container_name: amr_api
    # 注意：沒有 ports！外部只能透過 nginx 的 /api/ 存取
    environment:
      # 主機名稱 "postgres" 就是下面的 service 名稱，由 Docker 內建 DNS 解析
      DATABASE_URL: postgresql://${POSTGRES_USER:-amr}:${POSTGRES_PASSWORD:-amr_dev_pw}@postgres:5432/${POSTGRES_DB:-amr}
      ROSBRIDGE_URL: ws://host.docker.internal:9090
      POSE_TOPIC: ${POSE_TOPIC:-/odom}
      POSE_TYPE: ${POSE_TYPE:-nav_msgs/msg/Odometry}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - web        # 讓 nginx 找得到它
      - backend    # 讓它找得到 postgres
    depends_on:
      postgres:
        condition: service_healthy   # 等資料庫真的能連線才啟動，不只是「容器開了」
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: amr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amr_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-amr}
      TZ: Asia/Taipei
    volumes:
      # 資料存在 named volume，容器刪掉重建資料還在
      - pgdata:/var/lib/postgresql/data
      # 第一次建立資料庫時自動執行
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  web:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # 這個網路完全不能連外，也不能從主機直接連進來

volumes:
  ros_build:
  ros_install:
  ros_log:
  pgdata:
