# Nginx：提供監控網頁，並把 WebSocket 反向代理到 rosbridge
#
# 重點：Nginx 在 bridge 網路裡，rosbridge 在 host 網路上。
# 在 bridge 網路裡，"localhost" 指的是 Nginx 容器自己，不是主機！
# 所以要用 host.docker.internal（在 compose 的 extra_hosts 指向 host-gateway）
# 才能連到主機上的 9090 port。

# WebSocket 升級需要的標頭：有 Upgrade 就送 "upgrade"，沒有就送 "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 靜態網頁
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 瀏覽器連 ws://<主機>:8080/rosbridge/ → 轉給主機的 rosbridge :9090
    # proxy_pass 結尾的 "/" 會把 /rosbridge/ 前綴去掉，
    # 因為 rosbridge 只接受根路徑 "/"
    location /rosbridge/ {
        proxy_pass http://host.docker.internal:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        # 預設 60 秒沒資料就斷線；機器人靜止時 topic 可能很久沒更新
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 給 healthcheck 用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
