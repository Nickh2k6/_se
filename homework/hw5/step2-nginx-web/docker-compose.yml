# 第 1 步：ROS 2 開發容器 + rosbridge（host 網路）
# 第 2 步：Nginx 監控網頁（bridge 網路）
# 用法：docker compose up -d --build
#       docker compose exec ros_dev bash
#       瀏覽器開 http://localhost:8080

# 兩個 service 共用的設定（YAML anchor，可以少寫重複的東西）
x-ros-common: &ros-common
  image: amr/ros2-humble-dev:latest
  # ROS 2 的 DDS 用 multicast 找節點，bridge 網路會擋掉，
  # 所以 ROS 相關容器一律用 host 網路
  network_mode: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  restart: unless-stopped

services:
  # 開發用容器：寫程式、colcon build、跑自己的節點
  ros_dev:
    <<: *ros-common
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    container_name: ros_dev
    volumes:
      # bind mount：主機改程式，容器內立刻看得到
      - ./src:/ws/src
      - ./maps:/ws/maps
      # named volume：build 產物留在 Docker 管理的空間，
      # 不會跟主機原生 colcon build 的結果互相覆蓋
      - ros_build:/ws/build
      - ros_install:/ws/install
      - ros_log:/ws/log
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

  # rosbridge：把 ROS topic 轉成 WebSocket (port 9090)，給第 2 步的網頁用
  rosbridge:
    <<: *ros-common
    container_name: rosbridge
    depends_on:
      - ros_dev   # 確保 image 先被 ros_dev build 出來
    command: ["ros2", "launch", "rosbridge_server", "rosbridge_websocket_launch.xml", "port:=9090"]

  # 第 2 步：監控網頁 + WebSocket 反向代理
  # 這個容器「不用」host 網路，而是放在自己的 bridge 網路裡，
  # 對外只開 8080 port —— 這才是一般 web 服務的正常做法
  nginx:
    image: nginx:1.27-alpine
    container_name: amr_nginx
    ports:
      - "8080:80"            # 主機 8080 → 容器 80
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # 讓容器裡的 host.docker.internal 指向主機（Linux 需要手動加這行）
      - "host.docker.internal:host-gateway"
    networks:
      - web
    depends_on:
      - rosbridge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  web:
    driver: bridge

volumes:
  ros_build:
  ros_install:
  ros_log:
