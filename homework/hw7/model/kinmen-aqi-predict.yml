# 金門空品看板：每天下午用 16 時版模型預測明天的 AQI，上傳到看板
# 這個檔案要放在 repo 根目錄的 .github/workflows/ 才會生效
name: 金門空品看板每日預測

on:
  schedule:
    # cron 用 UTC：08:40 UTC = 台灣 16:40（金門 15 時的觀測約 15:15 公布，16 時前的資料到齊）
    - cron: "40 8 * * *"
    # 18:40 再跑一次：GitHub 排程偶爾延遲或略過，或昨天的官方日 AQI 晚公布時補上；同一天重跑會覆蓋，不會重複
    - cron: "40 10 * * *"
  # 可以在 GitHub 的 Actions 頁面手動按「Run workflow」
  workflow_dispatch:
    inputs:
      test_date:
        description: "測試用：假裝今天是這一天（YYYY-MM-DD），只預測、不上傳；留空就是正式預測明天"
        required: false
        default: ""

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: homework/hw7/model
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: homework/hw7/model/requirements.txt
      - run: pip install -r requirements.txt
      - name: 預測明天並上傳
        run: |
          if [ -n "$TEST_DATE" ]; then
            python predict_daily.py --date "$TEST_DATE"
          else
            python predict_daily.py
          fi
        env:
          TEST_DATE: ${{ inputs.test_date }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
          AQI_API_TOKEN: ${{ secrets.AQI_API_TOKEN }}
          AQI_SITE: https://kinmen-aqi.nickh2k6.workers.dev
